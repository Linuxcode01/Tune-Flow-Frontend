# TuneFlow client lint rules.
# The baseline is flutter_lints; the extras below encode decisions the docs care about:
# explicit types at API boundaries, no stray prints (use AppLogger), and immutable state.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Treat missing awaits as errors: an unawaited token write is a security bug, not a style nit.
    unawaited_futures: error
    # Dead code and unreachable switches hide real mistakes in the player state machine.
    dead_code: error
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_unnecessary_containers
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sized_box_for_whitespace
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters
