org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---------------------------------------------------------------------------------------------
# Kotlin incremental compilation is disabled on purpose - do not "helpfully" remove this line.
#
# On Windows, when the Pub cache and the project live on different drives
# (C:\Users\<you>\AppData\Local\Pub\Cache vs D:\...), the Kotlin incremental compiler cannot store
# plugin source paths relative to the module root, and the build dies with:
#
#   java.lang.IllegalArgumentException: this and base files have different roots:
#     C:\Users\...\Pub\Cache\hosted\pub.dev\shared_preferences_android-2.4.28\...\LegacySharedPreferencesPlugin.kt
#     and D:\tuneflow-frontend1\android.
#   > Could not close incremental caches in build\shared_preferences_android\kotlin\compileDebugKotlin\cacheable
#   > Task :shared_preferences_android:compileDebugKotlin FAILED
#
# The Kotlin daemon fails, the in-process fallback fails the same way, and the APK is never packaged.
# Switching incremental compilation off means those caches are never created, so the failure cannot
# occur at all.
#
# What it costs: slower rebuilds of *plugin* Kotlin sources only. Your Dart code still rebuilds
# incrementally through the Flutter tool, so hot reload and hot restart are unaffected.
#
# Prefer to keep Kotlin incremental compilation on? Put the Pub cache and the project on the SAME
# drive and delete this line:
#     setx PUB_CACHE D:\pub-cache     (open a new terminal, then: flutter pub get)
# ---------------------------------------------------------------------------------------------
kotlin.incremental=false

# The Android Gradle Plugin compiles plugin sources with an old language level; this silences the
# JDK 21 "source value 8 is obsolete" warning spam without changing behaviour.
android.javaCompile.suppressSourceTargetDeprecationWarning=true
